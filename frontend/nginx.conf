limit_req_zone $binary_remote_addr zone=aurora:10m rate=10r/s;
server {
  listen 5171;
  root /usr/share/nginx/html;
  client_max_body_size 40m;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header X-Frame-Options "DENY" always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' blob:; style-src 'self' 'unsafe-inline'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
  location / { try_files $uri /index.html; }
  location /api/ {
    limit_req zone=aurora burst=20 nodelay;
    proxy_pass http://api:8101;
    proxy_read_timeout 210s;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
  }
  location /ready {
    proxy_pass http://api:8101;
    proxy_set_header Host $http_host;
  }
  location /health {
    proxy_pass http://api:8101;
    proxy_set_header Host $http_host;
  }
}
