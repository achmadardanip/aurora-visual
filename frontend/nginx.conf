limit_req_zone $binary_remote_addr zone=aurora:10m rate=10r/s;
server {
  listen 5171;
  root /usr/share/nginx/html;
  client_max_body_size 40m;
  add_header X-Content-Type-Options nosniff;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' blob:; style-src 'self' 'unsafe-inline'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
  location / { try_files $uri /index.html; }
  location /api/ { limit_req zone=aurora burst=20 nodelay; proxy_pass http://api:8101; proxy_read_timeout 60s; }
  location /ready { proxy_pass http://api:8101; }
  location /health { proxy_pass http://api:8101; }
}
