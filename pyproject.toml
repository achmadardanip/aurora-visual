[project]
name = "aurora-visual"
version = "1.0.0"
description = "Auditable image-caption atomic consistency, AURORA module 1"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "pydantic>=2.10,<3",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.14,<2",
  "python-multipart>=0.0.20,<1",
  "pillow>=11,<13",
  "numpy>=2,<3",
  "rfc8785>=0.1.4,<1",
  "httpx>=0.28,<1",
  "pytesseract>=0.3.13,<1",
  "python-dotenv>=1,<2",
  "c2pa-python>=0.37,<1",
]
[project.optional-dependencies]
ml = ["torch>=2.6,<3", "open-clip-torch>=2.32,<4", "scipy>=1.15,<2", "optuna>=3.6,<6"]
modal = ["modal>=1.0,<2"]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "ruff>=0.11,<1", "jsonschema>=4,<5"]
[project.scripts]
aurora = "aurora_visual.cli:main"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["backend/app", "backend/aurora_visual"]
[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests"]
[tool.ruff]
target-version = "py311"
line-length = 110
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
